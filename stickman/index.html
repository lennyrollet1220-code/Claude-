<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feu contre Foudre</title>
<style>
  :root { --bg:#0b0b0d; --fg:#f2efe9; --fire:#ff7a1a; --bolt:#ffd84a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; background:#000; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:rgba(0,0,0,.55); cursor:pointer;
    transition:opacity .4s; text-align:center; padding:16px; box-sizing:border-box; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { margin:0; font-size:clamp(22px,5vw,54px); letter-spacing:.25em; font-weight:800; }
  #overlay h1 .r { color:var(--fire); } #overlay h1 .y { color:var(--bolt); }
  #overlay button { font:inherit; font-size:clamp(14px,2.4vw,20px); padding:.7em 1.6em; border-radius:999px;
    border:2px solid var(--fg); background:transparent; color:var(--fg); cursor:pointer; letter-spacing:.1em; }
  #overlay p { margin:0; opacity:.7; font-size:clamp(11px,1.6vw,14px); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="overlay">
    <h1><span class="r">FEU</span> ✕ <span class="y">FOUDRE</span></h1>
    <button id="play">▶ LANCER (avec le son)</button>
    <p>Touchez l'écran pendant l'animation pour passer en plein écran</p>
  </div>
</div>
<script>
'use strict';
// ============================================================
//  Feu contre Foudre — animation stickman 100 % code (canvas)
//  Rouge = pouvoir du feu, Jaune = pouvoir de la foudre.
//  Décor, personnages, katanas, effets et sons sont générés en JS.
// ============================================================
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const D2R = Math.PI / 180;
const END = 27.5;

// ---------- utilitaires ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const EASE = {
  lin: k => k,
  io: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  step: k => k < 1 ? 0 : 1,
};
let seed = 12345;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);
const fade = (t, a, b, c, d) => t < a ? 0 : t < b ? (t - a) / (b - a) : t < c ? 1 : t < d ? 1 - (t - c) / (d - c) : 0;

// ---------- squelette & poses ----------
const L = { torso: 62, neck: 26, ua: 34, fa: 32, th: 42, sh: 42, head: 25, guard: 8, blade: 100, tip: 108 };
// Membres : 0 = vers le bas, + = vers l'avant. Torse : + = penché en avant. Sabre : 0 = haut, 90 = devant.
const P = {
  idle:      { t:4,  hd:4,   fa1:8,   fa2:14,  ba1:-8,  ba2:-4,  fl1:10, fl2:2,  bl1:-10, bl2:-16, s:-110, d:0 },
  hilt:      { t:18, hd:10,  fa1:28,  fa2:-25, ba1:10,  ba2:-15, fl1:38, fl2:8,  bl1:-32, bl2:-45, s:-110, d:0 },
  draw:      { t:20, hd:0,   fa1:95,  fa2:100, ba1:-50, ba2:-70, fl1:38, fl2:8,  bl1:-32, bl2:-45, s:100, d:1 },
  ready:     { t:10, hd:0,   fa1:40,  fa2:85,  ba1:25,  ba2:80,  fl1:35, fl2:8,  bl1:-30, bl2:-45, s:55,  d:1 },
  dashA:     { t:38, hd:-10, fa1:-45, fa2:-25, ba1:-60, ba2:-40, fl1:70, fl2:10, bl1:-45, bl2:-95, s:-115, d:1 },
  dashB:     { t:38, hd:-10, fa1:-40, fa2:-20, ba1:-55, ba2:-35, fl1:-30,fl2:-80,bl1:65,  bl2:15,  s:-112, d:1 },
  clash:     { t:20, hd:5,   fa1:70,  fa2:95,  ba1:55,  ba2:95,  fl1:50, fl2:5,  bl1:-40, bl2:-60, s:40,  d:1 },
  overhead:  { t:-5, hd:-5,  fa1:165, fa2:175, ba1:150, ba2:170, fl1:25, fl2:5,  bl1:-25, bl2:-35, s:-30, d:1 },
  downslash: { t:30, hd:15,  fa1:85,  fa2:75,  ba1:75,  ba2:80,  fl1:55, fl2:5,  bl1:-40, bl2:-60, s:125, d:1 },
  blockHigh: { t:-5, hd:-10, fa1:60,  fa2:150, ba1:40,  ba2:145, fl1:20, fl2:0,  bl1:-30, bl2:-45, s:62,  d:1 },
  blockLow:  { t:5,  hd:0,   fa1:35,  fa2:60,  ba1:25,  ba2:55,  fl1:30, fl2:5,  bl1:-30, bl2:-45, s:150, d:1 },
  thrust:    { t:32, hd:10,  fa1:92,  fa2:90,  ba1:85,  ba2:88,  fl1:65, fl2:0,  bl1:-45, bl2:-70, s:92,  d:1 },
  windSide:  { t:-8, hd:-5,  fa1:-75, fa2:-50, ba1:-60, ba2:-40, fl1:25, fl2:5,  bl1:-25, bl2:-40, s:-95, d:1 },
  followSide:{ t:28, hd:10,  fa1:115, fa2:105, ba1:90,  ba2:80,  fl1:50, fl2:5,  bl1:-40, bl2:-60, s:105, d:1 },
  jumpBack:  { t:-20,hd:-10, fa1:20,  fa2:60,  ba1:10,  ba2:50,  fl1:70, fl2:-20,bl1:40,  bl2:-40, s:60,  d:1 },
  sheathe:   { t:8,  hd:5,   fa1:30,  fa2:-25, ba1:10,  ba2:-15, fl1:14, fl2:2,  bl1:-14, bl2:-20, s:-110, d:0 },
  iai:       { t:30, hd:5,   fa1:30,  fa2:-30, ba1:15,  ba2:-20, fl1:55, fl2:5,  bl1:-50, bl2:-80, s:-110, d:0 },
  crossDash: { t:45, hd:0,   fa1:95,  fa2:95,  ba1:-60, ba2:-80, fl1:75, fl2:15, bl1:-60, bl2:-100,s:95,  d:1 },
  after:     { t:35, hd:10,  fa1:100, fa2:120, ba1:-55, ba2:-75, fl1:60, fl2:5,  bl1:-55, bl2:-85, s:150, d:1 },
  standAfter:{ t:8,  hd:-5,  fa1:60,  fa2:90,  ba1:-10, ba2:-5,  fl1:14, fl2:2,  bl1:-14, bl2:-20, s:140, d:1 },
  kneel:     { t:35, hd:35,  fa1:90,  fa2:30,  ba1:10,  ba2:0,   fl1:90, fl2:0,  bl1:5,   bl2:-90, s:175, d:1 },
  slump:     { t:55, hd:55,  fa1:95,  fa2:35,  ba1:5,   ba2:5,   fl1:90, fl2:0,  bl1:5,   bl2:-90, s:175, d:1 },
  // marche procédurale : la phase dépend de la position => les pieds ne glissent pas
  walk: (x, face) => {
    const ph = x * face * 2 * Math.PI / 108, s = Math.sin(ph), c = Math.cos(ph);
    return { t:6, hd:3, fl1:22*s, fl2:22*s - 34*Math.max(0, c), bl1:-22*s, bl2:-22*s - 34*Math.max(0, -c),
      fa1:-12*s + 6, fa2:-12*s + 18, ba1:12*s - 6, ba2:12*s + 6, s:-110, d:0 };
  },
};
const KEYS = ['t','hd','fa1','fa2','ba1','ba2','fl1','fl2','bl1','bl2','s'];

// ---------- chorégraphie ----------
// [temps, x, pose, {e: easing forcé, j: saut, h: pause (vitesse nulle)}]
// Sans easing forcé, tout est interpolé par splines (Catmull-Rom) => mouvements continus.
const RED = [
  [0,-560,'walk'],[4.6,-322,'walk'],[5.3,-300,'idle',{h:1}],[6.3,-300,'idle',{h:1}],[6.9,-300,'hilt',{h:1}],[8.3,-300,'hilt',{h:1}],
  [8.42,-300,'draw',{e:'out'}],[8.9,-300,'ready',{h:1}],
  [9.05,-292,'ready'],[9.2,-262,'dashA'],[9.35,-220,'dashB'],[9.5,-178,'dashA'],[9.65,-138,'dashB'],[9.8,-110,'clash',{e:'out'}],
  [10.1,-104,'clash'],[10.4,-112,'clash'],
  [10.6,-150,'ready'],[10.85,-152,'overhead',{h:1}],[11.05,-105,'downslash',{e:'in'}],[11.25,-110,'downslash'],[11.45,-115,'ready'],
  [11.6,-170,'jumpBack',{j:55}],[11.8,-230,'ready',{e:'in'}],[12.0,-232,'ready',{h:1}],
  [12.2,-115,'thrust',{e:'in'}],[12.32,-118,'thrust'],[12.5,-120,'ready'],[12.6,-122,'blockHigh',{e:'out'}],[12.75,-128,'blockHigh'],
  [12.95,-135,'windSide'],[13.12,-100,'followSide',{e:'in'}],[13.3,-112,'ready'],
  [13.6,-200,'jumpBack',{j:80}],[13.9,-320,'ready',{e:'in'}],
  [14.2,-320,'windSide',{h:1}],[14.38,-300,'followSide',{e:'in'}],[14.65,-305,'ready'],
  [14.9,-310,'blockHigh',{e:'out'}],[15.15,-330,'blockHigh'],[15.35,-325,'ready'],
  [15.48,-330,'windSide'],[15.65,-290,'followSide',{e:'in'}],[15.95,-300,'ready'],[16.6,-300,'ready',{h:1}],
  [17.0,-300,'ready',{h:1}],[17.5,-300,'sheathe',{h:1}],[18.0,-300,'iai',{h:1}],[19.6,-300,'iai',{h:1}],
  [19.72,-150,'crossDash',{e:'lin'}],[19.92,150,'crossDash',{e:'lin'}],[20.1,270,'after',{e:'out'}],
  [22.1,270,'after',{h:1}],[22.55,270,'kneel',{e:'in'}],[23.8,270,'kneel',{h:1}],[24.8,270,'slump',{h:1}],
];
const YEL = [
  [0,560,'walk'],[4.8,322,'walk'],[5.5,300,'idle',{h:1}],[6.9,300,'idle',{h:1}],[7.5,300,'hilt',{h:1}],[8.3,300,'hilt',{h:1}],
  [8.42,300,'draw',{e:'out'}],[8.9,300,'ready',{h:1}],
  [9.05,292,'ready'],[9.2,262,'dashB'],[9.35,220,'dashA'],[9.5,178,'dashB'],[9.65,138,'dashA'],[9.8,110,'clash',{e:'out'}],
  [10.1,116,'clash'],[10.4,108,'clash'],
  [10.6,150,'ready'],[10.8,150,'ready'],[10.95,140,'blockHigh',{e:'out'}],[11.1,132,'blockHigh'],[11.3,130,'ready'],
  [11.45,128,'windSide'],[11.65,60,'followSide',{e:'in'}],[11.9,90,'ready'],[12.05,120,'ready'],
  [12.18,125,'blockLow',{e:'out'}],[12.3,135,'blockLow'],[12.5,120,'overhead'],[12.68,78,'downslash',{e:'in'}],[12.8,85,'downslash'],
  [12.95,135,'windSide'],[13.12,100,'followSide',{e:'in'}],[13.3,112,'ready'],
  [13.6,200,'jumpBack',{j:80}],[13.9,320,'ready',{e:'in'}],[14.3,320,'ready',{h:1}],[14.7,320,'ready',{h:1}],
  // téléportation éclair : disparaît, réapparaît au-dessus du rouge
  [14.82,-250,'overhead',{e:'step',j:170}],[15.1,-205,'downslash',{e:'in'}],[15.3,-200,'downslash'],[15.48,-195,'ready'],
  [15.6,-190,'blockLow',{e:'out'}],[15.8,-110,'jumpBack',{j:60}],[15.95,-80,'ready',{e:'in'}],[16.0,-80,'ready',{h:1}],
  [16.15,300,'ready',{e:'step'}],[17.0,300,'ready',{h:1}],[17.5,300,'sheathe',{h:1}],[18.0,300,'iai',{h:1}],[19.6,300,'iai',{h:1}],
  [19.72,150,'crossDash',{e:'lin'}],[19.92,-150,'crossDash',{e:'lin'}],[20.1,-270,'after',{e:'out'}],
  [22.1,-270,'after',{h:1}],[22.9,-270,'standAfter'],[23.2,-270,'standAfter',{h:1}],[23.6,-270,'sheathe'],[24.4,-270,'idle',{h:1}],
];
function prep(track, face, hide) {
  const k = track.map(([t, x, p, o]) => ({ t, x, p, e: o && o.e, j: (o && o.j) || 0, h: o && o.h }));
  k.face = face; k.hide = hide || []; return k;
}
const RT = prep(RED, 1), YT = prep(YEL, -1, [[14.7, 14.82], [16.0, 16.15]]);
const hidden = (tr, t) => tr.hide.some(([a, b]) => t >= a && t < b);

function resolvePose(name, x, face) { const p = P[name]; return typeof p === 'function' ? p(x, face) : p; }
function poseAt(K, t) {
  const n = K.length;
  if (t <= K[0].t) t = K[0].t;
  let i = 0; while (i < n - 2 && K[i + 1].t <= t) i++;
  const a = K[i], b = K[i + 1] || a, dt = b.t - a.t || 1;
  const s = clamp((t - a.t) / dt, 0, 1);
  const o = {};
  const fnSeg = typeof P[a.p] === 'function' || typeof P[b.p] === 'function';
  if (b.e || fnSeg) {
    const k = EASE[b.e || 'io'](s);
    o.x = lerp(a.x, b.x, b.e ? k : s); o.j = lerp(a.j, b.j, k);
    const pa = resolvePose(a.p, o.x, K.face), pb = resolvePose(b.p, o.x, K.face);
    for (const key of KEYS) o[key] = lerp(pa[key], pb[key], k);
    o.d = k < .5 ? pa.d : pb.d;
    return o;
  }
  // spline d'Hermite (tangentes Catmull-Rom non uniformes)
  const val = (j, key) => key === 'x' ? K[j].x : key === 'j' ? K[j].j : resolvePose(K[j].p, K[j].x, K.face)[key];
  const tan = (j, key) => {
    if (K[j].h || j === 0 || j === n - 1) return 0;
    if (K[j].e === 'step' || (K[j + 1] && K[j + 1].e === 'step')) return 0;
    return .85 * (val(j + 1, key) - val(j - 1, key)) / (K[j + 1].t - K[j - 1].t);
  };
  const s2 = s * s, s3 = s2 * s;
  const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;
  for (const key of [...KEYS, 'x', 'j'])
    o[key] = h00 * val(i, key) + h10 * dt * tan(i, key) + h01 * val(i + 1, key) + h11 * dt * tan(i + 1, key);
  o.j = Math.max(0, o.j);
  o.d = s < .5 ? P[a.p].d : P[b.p].d;
  return o;
}
// petite inertie : la tête et le bras arrière suivent avec un léger retard
function livePose(K, t, ph) {
  const p = poseAt(K, t), q0 = poseAt(K, t - .06), q = Math.abs(q0.x - p.x) > 120 ? p : q0;
  p.hd += (q.t - p.t) * .5;
  p.ba1 = lerp(p.ba1, q.ba1, .45); p.ba2 = lerp(p.ba2, q.ba2, .55);
  p.t += Math.sin(t * 2.1 + ph) * 1.3; p.fa1 += Math.sin(t * 2.1 + ph + 1) * 1.4;
  return p;
}

// ---------- caméra ----------
const CAM = [
  [0,-560,-150,1.05],[4.8,-40,-115,1.0],
  [6.3,-290,-85,2.4,'step'],[6.95,-290,-85,2.6,'lin'],
  [6.95,290,-85,2.4,'step'],[7.55,290,-85,2.6,'lin'],
  [7.55,0,-115,1.12,'step'],[9.0,0,-115,1.22,'lin'],
  [9.8,0,-130,1.7,'io'],[13.3,0,-130,1.6,'lin'],
  [13.9,0,-115,1.15,'out'],[14.6,40,-120,1.15,'io'],
  [14.85,-210,-160,1.45,'out'],[15.4,-240,-140,1.6,'io'],[16.0,-180,-120,1.3,'io'],
  [16.4,0,-115,1.12,'io'],[19.6,0,-110,1.35,'lin'],
  [19.9,0,-110,1.0,'out'],[22.1,0,-110,1.12,'lin'],
  [22.1,240,-95,1.9,'step'],[23.0,250,-90,2.05,'lin'],
  [23.0,-250,-95,1.9,'step'],[24.3,-250,-95,2.0,'lin'],
  [24.3,0,-110,1.05,'step'],[27.5,0,-120,1.15,'lin'],
];
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && CAM[i + 1][0] <= t) i++;
  const a = CAM[i], b = CAM[i + 1] || a, span = b[0] - a[0];
  const k = EASE[b[4] || 'io'](span > 0 ? clamp((t - a[0]) / span, 0, 1) : 1);
  return { x: lerp(a[1], b[1], k), y: lerp(a[2], b[2], k), z: lerp(a[3], b[3], k) };
}

// ralentis [début, fin, vitesse]
const SLOWMO = [[9.76, 10.02, .3], [14.98, 15.16, .35], [19.68, 19.98, .2], [22.05, 22.25, .5]];
const speedAt = t => { for (const s of SLOWMO) if (t >= s[0] && t < s[1]) return s[2]; return 1; };
// temps réel correspondant à un temps d'animation (pour le son)
const REAL = (() => { const arr = []; let a = 0, r = 0; const d = 1 / 600; while (a <= END + 1) { arr.push([a, r]); a += d * speedAt(a); r += d; } return arr; })();
function realOf(anim) { let lo = 0, hi = REAL.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (REAL[m][0] <= anim) lo = m; else hi = m; } return REAL[lo][1]; }

// ---------- géométrie ----------
const V = a => [Math.sin(a * D2R), Math.cos(a * D2R)];
const U = a => [Math.sin(a * D2R), -Math.cos(a * D2R)];
function skeleton(p, face) {
  const legDepth = (a, b) => L.th * Math.cos(a * D2R) + L.sh * Math.cos(b * D2R);
  const hipY = -Math.max(legDepth(p.fl1, p.fl2), legDepth(p.bl1, p.bl2)) - p.j;
  const w = (v) => [p.x + face * v[0], v[1]];
  const add = (pt, v, len) => [pt[0] + v[0] * len, pt[1] + v[1] * len];
  const hip = [0, hipY], tv = U(p.t);
  const neck = add(hip, tv, L.torso), head = add(neck, U(p.t + p.hd), L.neck), sh = add(neck, tv, -6);
  const fe = add(sh, V(p.fa1), L.ua), fh = add(fe, V(p.fa2), L.fa);
  const be = add(sh, V(p.ba1), L.ua), bh = add(be, V(p.ba2), L.fa);
  const fk = add(hip, V(p.fl1), L.th), ff = add(fk, V(p.fl2), L.sh);
  const bk = add(hip, V(p.bl1), L.th), bf = add(bk, V(p.bl2), L.sh);
  const scab = add(hip, [1, 0], 16), scabDir = U(-110);
  const dir = p.d ? U(p.s) : scabDir, hilt = p.d ? fh : scab;
  const r = {};
  for (const [k, v] of Object.entries({ hip, neck, head, sh, fe, fh, be, bh, fk, ff, bk, bf, hilt, scab, tip: add(hilt, dir, L.tip) })) r[k] = w(v);
  r.dir = [face * dir[0], dir[1]]; r.scabDir = [face * scabDir[0], scabDir[1]];
  r.drawn = p.d; r.face = face;
  r.bones = [[r.hip, r.neck], [r.sh, r.fe], [r.fe, r.fh], [r.sh, r.be], [r.be, r.bh], [r.hip, r.fk], [r.fk, r.ff], [r.hip, r.bk], [r.bk, r.bf]];
  return r;
}
const onBlade = (s, u) => [lerp(s.hilt[0] + s.dir[0] * L.guard, s.tip[0], u), lerp(s.hilt[1] + s.dir[1] * L.guard, s.tip[1], u)];
const onBody = s => { const b = s.bones[(rnd() * s.bones.length) | 0], u = rnd(); return [lerp(b[0][0], b[1][0], u), lerp(b[0][1], b[1][1], u)]; };

// ---------- décor (pré-rendu) ----------
function makeLayer(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
const HORIZON = 400;
const sky = makeLayer(W * 2, H, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, HORIZON + 40);
  gr.addColorStop(0, '#17161d'); gr.addColorStop(.55, '#36323d'); gr.addColorStop(1, '#7a6a70');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  const sun = g.createRadialGradient(w * .55, HORIZON - 30, 10, w * .55, HORIZON - 30, 520);
  sun.addColorStop(0, 'rgba(235,150,110,.45)'); sun.addColorStop(.4, 'rgba(180,100,100,.18)'); sun.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sun; g.fillRect(0, 0, w, h);
  g.filter = 'blur(18px)';
  for (let i = 0; i < 140; i++) {
    const y = rr(-40, HORIZON - 40), x = rr(-100, w + 100), dark = 1 - y / HORIZON;
    g.fillStyle = `rgba(${lerp(120, 22, dark) | 0},${lerp(108, 21, dark) | 0},${lerp(115, 28, dark) | 0},${rr(.25, .55)})`;
    g.beginPath(); g.ellipse(x, y, rr(80, 260), rr(18, 55), 0, 0, Math.PI * 2); g.fill();
  }
  g.filter = 'none';
});
function ridge(g, w, base, amp, rough, color, blur, step) {
  g.filter = blur ? `blur(${blur}px)` : 'none';
  g.fillStyle = color; g.beginPath(); g.moveTo(0, HORIZON + 200);
  let y = base;
  for (let x = 0; x <= w; x += step) {

function jag(a, b, disp, levels = 6) {
  let pts = [a, b];
  for (let l = 0; l < levels; l++) {
    const np = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i - 1], q = pts[i], dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1;
      const o = rr(-disp, disp);
      np.push([(p[0] + q[0]) / 2 - dy / len * o, (p[1] + q[1]) / 2 + dx / len * o], q);
    }
    pts = np; disp *= .55;
  }
  return pts;
}
function mkBolt(a, b, disp) {
  const main = jag(a, b, disp), lines = [main];
  for (let i = 0; i < 4; i++) {
    const p = main[(rr(.15, .8) * main.length) | 0], dx = b[0] - a[0], dy = b[1] - a[1], ang = Math.atan2(dy, dx) + rr(-.9, .9), len = Math.hypot(dx, dy) * rr(.12, .3);
    lines.push(jag(p, [p[0] + Math.cos(ang) * len, p[1] + Math.sin(ang) * len], disp * .3, 4));
  }
  return lines;
}
function strokeBolt(pts, a, w, rgb = '255,215,90') {
  const z = cam.z, s = pts.map(toS);
  const path = () => { ctx.beginPath(); ctx.moveTo(...s[0]); for (let i = 1; i < s.length; i++) ctx.lineTo(...s[i]); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  path(); ctx.strokeStyle = `rgba(${rgb},${.16 * a})`; ctx.lineWidth = w * 5 * z; ctx.stroke();
  path(); ctx.strokeStyle = `rgba(${rgb},${.5 * a})`; ctx.lineWidth = w * 2 * z; ctx.stroke();
  path(); ctx.strokeStyle = `rgba(255,255,245,${a})`; ctx.lineWidth = Math.max(1, w * .7 * z); ctx.stroke();
}

// ---------- son (WebAudio, synthétisé) ----------
const audio = (() => {

    if (fEnd) fl.frequency.exponentialRampToValueAtTime(fEnd, t + dur);

// traînées des lames (couleur du pouvoir)

  while (list.length && t - list[0].t > .1) list.shift();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';

    const a = list[i - 1], b = list[i];
    if (!a.d || !b.d || b.t <= a.t || Math.hypot(b.h[0] - a.h[0], b.h[1] - a.h[1]) > 70) continue;
    const sp = Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1]) / (b.t - a.t);
    const al = clamp((sp - 500) / 3500, 0, .45) * (1 - (t - b.t) / .1);

// ---------- décor dynamique ----------

function drawParts(dt) {

function textParts(partsArr, y, size, alpha, spacing = .3) {

// ---------- intensités des pouvoirs ----------
function fireLevel(t) {
  if (t < 8.4) return [0, 0];
  const ig = clamp((t - 8.4) / .45, 0, 1);
  let k = 1;
  if (t > 22.12) k = clamp(1 - (t - 22.12) / 1.2, 0, 1);
  if (t > 19.6 && t < 22.1) k = 1.3;
  return [k, ig];
}
function elecLevel(t) { return t < 8.4 ? 0 : (t > 19.6 && t < 22.1 ? 1.3 : 1) * (.75 + .25 * Math.sin(t * 40)); }

// ---------- rendu d'une image ----------
let prevT = -1;
function emitN(rate, dt) { const n = rate * dt; return Math.floor(n) + (rnd() < n % 1 ? 1 : 0); }
function render(t, dt) {
  for (const e of EVENTS) if (e[0] > prevT && e[0] <= t) runEvent(e);
  if (t > 9.8 && t < 10.4 && rnd() < .5) { const [x, y] = clashPoint(t); sparks(x, y, 2, .4); fire(x, y, rr(-60, 60), rr(-100, -20), rr(6, 12), .4); esparks(x, y, 1, .5); }
  prevT = t;

  cam = camAt(t);
  fx.shake *= Math.pow(.02, dt); fx.flash = Math.max(0, fx.flash - dt * 2.2); fx.skyFlash = Math.max(0, fx.skyFlash - dt * 3);
  shakeX = rr(-1, 1) * fx.shake; shakeY = rr(-1, 1) * fx.shake;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBG(t, dt);

  const rp = livePose(RT, t, 0), yp = livePose(YT, t, 1.7);
  const rs = skeleton(rp, 1), ys = skeleton(yp, -1);
  const yHide = hidden(YT, t);
  const [fLvl, ig] = fireLevel(t), eLvl = elecLevel(t);
  const rFire = rs.drawn ? fLvl : 0, yElec = ys.drawn && !yHide ? eLvl : 0;

  // ombres
  for (const [s, hid] of [[rs, false], [ys, yHide]]) {
    if (hid) continue;
    const g = toS([s.hip[0], 0]), sc = clamp(1 - (-s.hip[1] - 80) / 300, .4, 1);
    ctx.fillStyle = 'rgba(20,10,12,.35)'; ctx.beginPath(); ctx.ellipse(g[0], g[1] + 2, 55 * cam.z * sc, 7 * cam.z, 0, 0, 7); ctx.fill();
  }

  light(bladeMid(rs), '255,110,30', 260, .22 * rFire);
  light(bladeMid(ys), '255,215,90', 230, .16 * yElec * (rnd() < .2 ? 1.6 : 1));
  const aura = fade(t, 18.0, 19.2, 19.6, 19.75);
  light(rs.neck, '255,90,20', 240, .2 * aura); if (!yHide) light(ys.neck, '255,220,100', 220, .16 * aura);

  // images rémanentes (ruées)
  for (const [K, face, col, tint] of [[RT, 1, COL.r, '255,110,30'], [YT, -1, COL.y, '255,220,100']]) {
    if (hidden(K, t)) continue;
    const v = Math.abs(poseAt(K, t).x - poseAt(K, t - .02).x) / .02;
    if (v > 700 && v < 20000) {
      for (let i = 3; i >= 1; i--) drawBody(skeleton(poseAt(K, t - i * .035), face), col, .16 * (4 - i) / 3, null, 0, t, 0);
      if (face < 0) { const a = skeleton(poseAt(K, t - .12), face).hip, b = ys.hip; ctx.save(); ctx.globalCompositeOperation = 'lighter'; strokeBolt(jag(a, b, 30, 5), .9, 1.2); ctx.restore(); }
      else { for (const f of [rs.ff, rs.bf]) if (rnd() < .9) fire(f[0], f[1] - 4, rr(-150, -40), rr(-80, -20), rr(8, 15), rr(.3, .6)); }
    }
  }

  const order = t > 19.85 ? [[ys, 'y'], [rs, 'r']] : [[rs, 'r'], [ys, 'y']];

      fire(p[0] + rr(-3, 3), p[1] + rr(-3, 3), rr(-25, 25), rr(-140, -50), rr(5, 11) * (.7 + .5 * u), rr(.22, .45));

  }

  // braises pendant le gros plan sur la main
  if (t > 6.4 && t < 8.4) for (let i = emitN(25, dt); i > 0; i--) { const p = rs.scab; ember(p[0] + rr(-15, 15), p[1] + rr(-10, 5)); }
  if (aura > 0) {
    for (let i = emitN(240 * aura, dt); i > 0; i--) { const p = onBody(rs); fire(p[0] + rr(-6, 6), p[1], rr(-20, 20), rr(-160, -60), rr(6, 12), rr(.25, .5)); }
    for (let i = emitN(20 * aura, dt); i > 0; i--) ember(rs.hip[0] + rr(-80, 80), rr(-30, 0));
  }

  // ---- FOUDRE (jaune) ----
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (yElec > 0) {
    const n = 2 + (rnd() < .5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const u1 = rnd() * .5, u2 = u1 + rr(.3, .5);
      strokeBolt(jag(onBlade(ys, u1), onBlade(ys, u2), 7, 4), rr(.5, 1), .7);
    }
    if (rnd() < .25) { const p = onBlade(ys, rnd()), a = rr(0, 6.28), l = rr(25, 60); strokeBolt(jag(p, [p[0] + Math.cos(a) * l, p[1] + Math.sin(a) * l], 10, 4), 1, .6); }
    for (let i = emitN(30, dt); i > 0; i--) { const p = onBlade(ys, rnd()); esparks(p[0], p[1], 1, .3); }
  }
  if (t > 7.0 && t < 8.4 && !yHide && rnd() < .3) { const p = ys.scab; strokeBolt(jag([p[0] + rr(-12, 12), p[1] + rr(-12, 6)], [p[0] + rr(-25, 25), p[1] + rr(-25, 10)], 6, 3), .9, .5); }

  // éclairs (frappes, téléportations)
  for (const b of fx.bolts) {

  drawTrail(trails.r, rs, t, '255,120,30', true);
  drawTrail(trails.y, ys, t, '255,220,90', !yHide);

  // vague de feu
  for (const w of fx.waves) {
    w.age += dt; const x = w.x + w.v * w.age;
    for (let i = 0; i < 14; i++) { const a = rr(-1.1, 1.1); fire(x + Math.cos(a) * 60 - 60, w.y + Math.sin(a) * 75, rr(-200, 0), rr(-80, 20), rr(10, 20), rr(.2, .4)); }
    light([x, w.y], '255,110,30', 300, .35);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const c = toS([x - 60, w.y]);
    for (const [lw, col] of [[22, 'rgba(255,90,20,.35)'], [10, 'rgba(255,190,80,.7)'], [4, 'rgba(255,255,230,.95)']]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw * cam.z; ctx.beginPath(); ctx.ellipse(c[0], c[1], 60 * cam.z, 78 * cam.z, 0, -1.2, 1.2); ctx.stroke();
    }
    ctx.restore();
  }
  fx.waves = fx.waves.filter(w => w.age < w.life);

  drawParts(dt);
  drawAmbient(t, dt);

  // ondes de choc
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const r of fx.rings) {
    r.age += dt; const k = r.age / r.life; if (k >= 1) continue;
    const s = toS([r.x, r.y]); ctx.strokeStyle = `rgba(255,235,200,${.6 * (1 - k)})`; ctx.lineWidth = (1 - k) * 10 * cam.z;
    ctx.beginPath(); ctx.ellipse(...s, r.r * EASE.out(k) * cam.z, r.r * .6 * EASE.out(k) * cam.z, 0, 0, 7); ctx.stroke();
  }
  fx.rings = fx.rings.filter(r => r.age < r.life);
  // traits de coupe
  for (const l of fx.lines) {
    l.age += dt; const k = l.age / l.life; if (k >= 1) continue;
    if (l.diag) {
      const a = toS([l.x - 45, l.y - 28]), b = toS([l.x + 45, l.y + 28]);
      strokeBolt([[l.x - 45, l.y - 28], [l.x + 45, l.y + 28]], 1 - k, 1);
    } else {
      const y = toS([0, l.y])[1], th = (k < .1 ? k * 10 : 1 - (k - .1) / .9) * 10;
      const g = ctx.createLinearGradient(0, y - th * 3, 0, y + th * 3);
      g.addColorStop(0, 'rgba(255,120,30,0)'); g.addColorStop(.35, `rgba(255,140,40,${.8 * (1 - k)})`); g.addColorStop(.5, `rgba(255,255,255,${1 - k})`);
      g.addColorStop(.65, `rgba(255,220,90,${.8 * (1 - k)})`); g.addColorStop(1, 'rgba(255,220,90,0)');
      ctx.fillStyle = g; ctx.fillRect(0, y - th * 3, W, th * 6);
    }
  }
  fx.lines = fx.lines.filter(l => l.age < l.life);
  ctx.restore();

  // étalonnage
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const slow = fade(t, 19.7, 19.8, 19.9, 22.0);
  if (slow > 0) { ctx.fillStyle = `rgba(20,20,40,${.25 * slow})`; ctx.fillRect(0, 0, W, H); }
  if (fx.flash > 0) { ctx.fillStyle = `rgba(${fx.flashCol},${Math.min(1, fx.flash)})`; ctx.fillRect(0, 0, W, H); }
  const bar = 70 * EASE.io(clamp((t - 7.55) / .8, 0, 1));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);

  textParts([['FEU', '#ff7a1a'], ['  ✕  ', '#f2efe9'], ['FOUDRE', '#ffd84a']], H * .3, 52, fade(t, .8, 1.8, 3.6, 4.6), .35);
  textParts([['le vent se lève…', 'rgba(255,255,255,.75)']], H * .3 + 60, 20, fade(t, 1.6, 2.6, 3.6, 4.6), .25);
  const end = fade(t, 25.6, 26.4, 99, 99);
  if (end > 0) { ctx.fillStyle = `rgba(0,0,0,${end})`; ctx.fillRect(0, 0, W, H); }
  textParts([['FIN', '#f2efe9']], H / 2, 64, fade(t, 26.2, 26.8, 99, 99), .6);
}

// ---------- boucle ----------
let animT = 0, last = 0, running = false;
function reset() { animT = 0; prevT = -1; parts = []; resetFx(); trails.r = []; trails.y = []; seed = 777; }
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const sp = speedAt(animT); animT += dt * sp;
  render(animT, dt * sp);
  if (animT < END) requestAnimationFrame(frame);
  else { running = false; overlay.querySelector('button').textContent = '↻ REVOIR'; overlay.classList.remove('hidden'); }
}
const overlay = document.getElementById('overlay');
function start() {
  if (running) return;
  try { const AC = window.AudioContext || window.webkitAudioContext; const c = audio.ready && audio.ctx.state !== 'closed' ? audio.ctx : new AC(); c.resume && c.resume(); audio.init(c, c.currentTime + .05); } catch (e) {}
  reset(); running = true; overlay.classList.add('hidden');
  last = performance.now(); requestAnimationFrame(frame);
}
overlay.addEventListener('click', start);
cv.addEventListener('click', () => { const el = document.getElementById('wrap'); (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); });
render(2.5, 0); prevT = -1; parts = []; resetFx();

// ---------- export vidéo ----------
window.__export = {
  END, W, H,
  reset() { reset(); },
  step(fps) { const dt = 1 / fps, sp = speedAt(animT); animT += dt * sp; render(animT, dt * sp); return animT; },
  frame() { return cv.toDataURL('image/jpeg', .92); },
  async audio() {
    const total = realOf(END) + 1.5;
    const oc = new OfflineAudioContext(2, Math.ceil(44100 * total), 44100);
    audio.init(oc, 0);
    for (const e of EVENTS) audio.play(e[1], e[2] || 1, realOf(e[0]));
    const buf = await oc.startRendering();
    const n = buf.length, ch = [buf.getChannelData(0), buf.getChannelData(1)];
    const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
    const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
    v.setUint32(24, 44100, true); v.setUint32(28, 44100 * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < 2; c++, o += 2) v.setInt16(o, clamp(ch[c][i], -1, 1) * 32767, true);
    let bin = ''; const u8 = new Uint8Array(ab); for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
    return btoa(bin);
  },
};
