name: Construire l'APK Pause Écran

on:
  push:
    branches: [claude/android-screen-time-limiter-qttbke]
    paths: ["PauseEcran/**", ".github/workflows/pause-ecran-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PauseEcran
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PauseEcran.apk

      - name: Publier l'APK (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pause-ecran
          name: "Pause Écran : APK à installer"
          make_latest: false
          body: |
            📱 Sur ton téléphone Android, touche **PauseEcran.apk** ci-dessous pour le télécharger, puis ouvre-le pour l'installer.
            Guide : https://github.com/${{ github.repository }}/blob/claude/android-screen-time-limiter-qttbke/PauseEcran/GUIDE.md
          files: PauseEcran/PauseEcran.apk
